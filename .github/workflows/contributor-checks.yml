name: Contributor checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contributor-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Contributor checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Node.js 24 LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install the committed dependency graph
        run: npm ci --no-audit --no-fund
      - name: Verify contribution, methodology, navigation, and feedback contracts
        run: >-
          node --import tsx --test --test-concurrency=2
          tests/contributor-readiness.test.mjs
          tests/methodology-page.test.mjs
          tests/footer-source-relocation.test.mjs
          tests/ecosystem-link.test.mjs
          tests/public-data-inventory.test.mjs
      - name: Typecheck routes and application code
        run: npm run typecheck
      - name: Build the bundled application
        run: npm run build
